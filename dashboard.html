<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動化工作流</title>
<style>
:root {
  --accent: #CCCCFF; --accent-ink: #1e1e3c; --c-model: #CCCCFF; --c-model-ink: #1e1e3c; --c-tool: #eb6834;
  --bg: #f5f4f0; --panel: #ffffff; --ink: #1c1c1a; --soft: #4a4a45; --muted: #85857d; --line: #e4e2dc;
  --ok: #1d7f47; --bad: #bf3a2e; --run: #5252b8; --warn: #a86d12; --tint: #f0efea; --run-tint: #ececff;
  --shadow: 0 8px 28px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
  --elev: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --accent: #CCCCFF; --accent-ink: #1e1e3c; --c-model: #CCCCFF; --c-model-ink: #1e1e3c; --c-tool: #d95926; --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --soft: #c4c3bc; --muted: #8d8c85; --line: #31312d;
          --ok: #52c186; --bad: #ee6d61; --run: #CCCCFF; --warn: #e0a84a; --tint: #262623; --run-tint: #2a2a40;
          --shadow: 0 10px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); --elev: #2b2b28; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.65 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 22px 20px 60px; }
header h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
.summary { color: var(--soft); margin: 4px 0 16px; }
.summary b { color: var(--ink); font-weight: 600; }
#detail a, .sumrow a, #model-menu a { color: var(--run); }
.sumrow { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin: 4px 0 16px; }
.sumrow .summary { margin: 0; }
#model-menu .mg { padding: 6px 10px 2px; font-size: 12px; color: var(--muted); letter-spacing: .05em; }
#model-menu .mi { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 10px; font-size: 13.5px; align-items: baseline; }
#model-menu .mi .why { grid-column: 2; color: var(--muted); font-size: 12.5px; white-space: normal; }
#model-menu details { grid-column: 2; font-size: 12.5px; }
#model-menu summary { cursor: pointer; color: var(--run); }
#model-menu pre { background: var(--tint); padding: 8px 12px; border-radius: 6px; margin: 4px 0; font: 12.5px ui-monospace, Menlo, monospace;
                   white-space: pre-wrap; }
.bad-text { color: var(--bad); } .ok-text { color: var(--ok); } .run-text { color: var(--run); } .warn-text { color: var(--warn); }
.muted { color: var(--muted); }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; margin: 0 0 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
button, .btn { padding: 7px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 500; cursor: pointer;
         font: inherit; font-size: 13.5px; white-space: nowrap; }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.ghost:hover { background: var(--tint); }
button { transition: transform var(--d-micro) var(--e-micro), filter var(--d-lumin) var(--e-out), box-shadow var(--d-lumin) var(--e-out),
         background-color var(--d-lumin) var(--e-out); }
button:hover:not(:disabled) { transform: scale(1.02); filter: brightness(1.07); }
button:active:not(:disabled) { transform: scale(.97); filter: brightness(.94); box-shadow: inset 0 1px 3px rgba(0,0,0,.28);
         transition-duration: var(--d-feedback); }
button:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }
input[type=text], input[type=time], input[type=number], select, textarea {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  font: inherit; font-size: 14px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.6; }

/* ── 分頁（配方 §10：底線是滑過去的） ── */
.tabs { position: relative; display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; color: var(--soft); border-radius: 6px 6px 0 0; padding: 8px 14px; font-size: 14.5px; }
.tabs button:hover:not(:disabled) { transform: none; background: var(--tint); filter: none; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tab-ind { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100px; background: var(--run); transform-origin: left; }

/* ── Skills ── */
.sk-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .sk-grid { grid-template-columns: 1fr; } }
.sk { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color var(--d-lumin) var(--e-out); }
.sk:last-child { border-bottom: 0; }
.sk:hover { background: var(--tint); }
.sk.sel { background: var(--run-tint); }
.sk .t { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sk .d { color: var(--soft); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--tint); color: var(--soft); }
.badge.k { background: var(--run-tint); color: var(--run); }
.sk-group { padding: 8px 16px 4px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
#sk-panel { padding: 20px 24px; min-height: 320px; }
#sk-panel h3 { margin: 0 0 4px; font-size: 18px; }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.row2 input[type=text] { flex: 1; min-width: 200px; }
.warnbox { background: var(--tint); border-left: 3px solid var(--warn); padding: 10px 14px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
/* 構建器 */
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1000px) { .builder { grid-template-columns: 1fr; } }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow: auto; padding: 4px 2px; }
.bub { padding: 9px 13px; border-radius: 12px; max-width: 92%; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.6; }
.bub.u { align-self: flex-end; background: var(--run-tint); }
.bub.a { align-self: flex-start; background: var(--tint); }
.bub.wait { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.draft textarea { width: 100%; min-height: 420px; font: 12.5px/1.55 ui-monospace, Menlo, monospace; }

/* ── 設定 ── */
#st-form { max-width: 860px; }
.st-sec { padding: 18px 22px; margin-bottom: 16px; }
.st-sec h3 { margin: 0 0 4px; font-size: 16px; }
.st-sec > .muted { font-size: 13px; margin-bottom: 8px; }
.st-sec .row { grid-template-columns: 170px 1fr; margin: 10px 0; }
.st-sec .row .hint { margin-top: 3px; }
.st-sec input[type=number] { width: 120px; }
.prov { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.prov-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.prov-h b { font-size: 15px; }
.st-save { position: sticky; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 12px 16px;
           background: var(--elev); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

/* ── 工具列：下拉選單 + 選中的工作流 ── */
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 20px; flex-wrap: wrap; }
.dd { position: relative; }
.dd-btn { display: flex; align-items: center; gap: 8px; background: var(--run-tint); color: var(--ink); padding: 8px 12px;
          font-weight: 600; font-size: 15px; min-width: 220px; justify-content: space-between; }
.dd-btn .caret { color: var(--muted); font-size: 11px; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--elev); transform-origin: top left; border: 1px solid var(--line);
        border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 100%; display: none; }
.menu.open { display: block; }
.menu.right { left: auto; right: 0; min-width: 180px; transform-origin: top right; }
.menu .item, .menu .plain, .run, .dd-btn { transition: background-color var(--d-lumin) var(--e-out); }
.menu .item { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px;
              border-radius: 7px; cursor: pointer; white-space: nowrap; }
.menu .item:hover, .menu .item.cur { background: var(--tint); }
.menu .item .sub { color: var(--muted); font-size: 12.5px; }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu .plain { display: block; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.menu .plain:hover { background: var(--tint); }
.menu .plain.danger { color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.info { flex: 1; min-width: 200px; color: var(--soft); font-size: 13.5px; line-height: 1.5; }
.info .d { color: var(--ink); }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch .tr { width: 32px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s; }
.switch .tr { transition: background-color var(--d-lumin) var(--e-out) !important; }
.switch .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
                     background: var(--panel); transition: transform var(--d-micro) var(--e-micro); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .tr { background: var(--ok); }
.switch input:checked + .tr::after { transform: translateX(14px); }
.bar .runin { width: 260px; }
/* 輸入框可以換行（Enter 換行、Ctrl/⌘+Enter 直接執行），打多了自動長高 */
textarea.runin { resize: none; min-height: 40px; max-height: 200px; line-height: 1.5; padding: 8px 12px; overflow-y: auto; display: block; }
/* 輸入框自己一整行，放在執行列最下面（其他按鈕留在上面那行） */
.bar textarea.runin { order: 99; flex: 1 1 100%; width: auto; }
.attach-btn .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; }
.att-pop { padding: 8px 10px 10px; display: grid; gap: 8px; }
.att-pop .ah { font-weight: 600; font-size: 13.5px; }
.att-pop .hint { color: var(--muted); font-size: 12.5px; }
.att-pop .row2 input[type=text] { min-width: 0; }
.att-imgs { display: flex; flex-wrap: wrap; gap: 6px; }
.att-imgs figure { position: relative; margin: 0; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.att-imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-imgs button { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: 12px; line-height: 18px; border-radius: 9px; background: rgba(0,0,0,.6); color: #fff; }
.cont { display: grid; gap: 8px; }
.cont textarea { min-height: 70px; resize: vertical; }
.cont .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.depth { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--soft); white-space: nowrap; }
.depth input[type=range] { width: 110px; accent-color: var(--run); margin: 0; cursor: pointer; }
.depth b { color: var(--ink); font-weight: 600; min-width: 2.2em; }
.depth .dh { color: var(--muted); font-size: 12.5px; white-space: normal; }
.depth-btn b { font-weight: 600; color: var(--ink); }
.model-btn b { font-weight: 600; color: var(--ink); } .model-btn.on b { color: var(--run); }
#model-pick { min-width: 280px; max-height: 60vh; overflow-y: auto; }
#model-pick .mh { font-size: 12px; color: var(--muted); padding: 8px 10px 2px; }
#model-pick .plain.cur { background: var(--tint); font-weight: 600; }
/* 極端值特效：max 是流動的彩虹（像 Claude Code 的 max / ultrathink），low 是安靜呼吸的冷色 */
.fx-max { background: linear-gradient(90deg, #ff7a7a, #ffc56b, #8fe39a, #7ab8ff, #c89bff, #ff7a7a); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: fx-flow 2.4s linear infinite; }
@keyframes fx-flow { to { background-position: -200% 0; } }
.fx-low { color: #8fa3b8 !important; animation: fx-breathe 2.8s ease-in-out infinite; }
@keyframes fx-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.depth-btn.fx-max-btn { box-shadow: 0 0 0 1px rgba(200,155,255,.55), 0 0 14px rgba(122,184,255,.35); animation: fx-glow 2.4s linear infinite; }
@keyframes fx-glow { 50% { box-shadow: 0 0 0 1px rgba(255,197,107,.6), 0 0 16px rgba(255,122,122,.35); } }
.depth-pop input[type=range].fx-max-range { accent-color: #c89bff; filter: drop-shadow(0 0 4px rgba(200,155,255,.7)); }
.depth-pop input[type=range].fx-low-range { accent-color: #8fa3b8; }
.fx-spark { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 99; }
@media (prefers-reduced-motion: reduce) { .fx-max, .fx-low, .depth-btn.fx-max-btn { animation: none; } }
.depth-pop { padding: 8px 10px 6px; display: grid; gap: 8px; }
.depth-pop .dp-h { font-weight: 600; font-size: 14px; }
.depth-pop input[type=range] { width: 100%; accent-color: var(--run); margin: 4px 0 0; cursor: pointer; }
.dp-ticks { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.dp-ticks span { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: color var(--d-lumin) var(--e-out); }
.dp-ticks span:hover { color: var(--ink); }
.dp-ticks span.on { color: var(--ink); font-weight: 600; }
.depth-pop .dh { font-size: 13.5px; color: var(--soft); }
.depth-pop .dp-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
@media (max-width: 760px) { .bar .runin { width: 100%; order: 5; } .dd-btn { min-width: 0; } }

/* ── 現在 ── */
#now:empty { display: none; }
#now { margin-bottom: 20px; }
.live { background: var(--panel); border: 1px solid var(--run); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
.live-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.live-head .t { font-size: 17px; font-weight: 600; }
.live-head .m { color: var(--muted); font-size: 13px; }
.track { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; align-items: center; }
.track .s { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--tint); color: var(--soft); }
.track .s.err { color: var(--bad); }
.track .s.cur { background: var(--run-tint); color: var(--run); font-weight: 600; }
.run.sel, .menu .item.cur { background: var(--run-tint) !important; }
.track .arrow { color: var(--muted); font-size: 11px; }
.doing { display: flex; gap: 10px; align-items: center; font-size: 16px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--run); flex: none; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  /* 減少動態：拿掉位移和縮放，保留不透明度和顏色（SKILL §5、配方 §25） */
  button:hover:not(:disabled), button:active:not(:disabled) { transform: none; }
  .switch .tr::after, .prog .pb div { transition-property: none; }
}
.doing .sec { color: var(--muted); font-size: 13px; }
.stream { margin-top: 10px; background: var(--tint); border-radius: 8px; padding: 12px 14px; max-height: 240px; overflow: auto;
          white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.7; color: var(--soft); }
.stream-label { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* ── 時間條 ── */
.tbar { display: flex; gap: 2px; height: 26px; margin: 4px 0 6px; border-radius: 6px; overflow: hidden; }
.tbar .seg { min-width: 3px; display: flex; align-items: center; padding: 0 7px; font-size: 12px; color: #fff; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; cursor: default; }
.tbar .seg.model { background: var(--c-model); color: var(--c-model-ink); }
.tbar .seg.tool { background: var(--c-tool); }
.tbar .seg.error { background: var(--bad); }
.tbar .seg.now { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px);
                 background-size: 17px 17px; animation: slide 1s linear infinite; }
@keyframes slide { to { background-position: 17px 0; } }
@media (prefers-reduced-motion: reduce) { .tbar .seg.now { animation: none; } }
.tlegend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); }
.tlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ── 過程：按輪分組 ── */
.rounds { display: flex; flex-direction: column; gap: 10px; }
.round { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.round .rh { display: flex; gap: 10px; align-items: baseline; }
.round .rn { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--tint); color: var(--soft);
             font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.round .rt { font-weight: 500; }
.round .rt small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.round .said { color: var(--soft); font-size: 13.5px; margin: 4px 0 0 32px; }
.acts { margin: 6px 0 0 32px; display: flex; flex-direction: column; gap: 4px; }
.act-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; font-size: 14px; align-items: baseline; }
.act-row .ic { font-weight: 700; }
.act-row .ic.ok { color: var(--ok); } .act-row .ic.bad { color: var(--bad); }
.act-row .res { color: var(--muted); font-size: 13px; }
.act-row .ms { color: var(--muted); font-size: 12px; }
.round details { margin: 4px 0 0 32px; }
.round details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.round pre { background: var(--tint); padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
             font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 300px; overflow: auto; margin: 6px 0 0; }

/* ── 現在：新版 ── */
.now-what { font-size: 18px; font-weight: 600; display: flex; gap: 10px; align-items: center; margin: 10px 0 2px; }
.now-what .sec { font-size: 13px; font-weight: 400; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin: 8px 0 10px; }
.prog .pb { flex: 1; max-width: 260px; height: 5px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.prog .pb div { height: 100%; width: 100%; background: var(--run); border-radius: 3px; transform-origin: left;
                transition: transform var(--d-layout) var(--e-layout), background-color var(--d-lumin) var(--e-out); }
.prog .pb div.hot { background: var(--warn); }
.recent { margin-top: 10px; }

/* ── 紀錄 + 詳情 ── */
.grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .wrap { padding: 16px 16px 40px; } }
.run { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px;
       border-bottom: 1px solid var(--line); cursor: pointer; }
.run:last-child { border-bottom: 0; }
.run:hover { background: var(--tint); }
.run.sel { background: var(--tint); }
#runs { position: relative; overflow: hidden; }
.sel-ind { position: absolute; left: 0; top: 0; width: 3px; height: 1px; background: var(--run); transform-origin: top left;
           opacity: 0; z-index: 2; pointer-events: none; }
.run .main { min-width: 0; }
.run .main .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .main .m { color: var(--muted); font-size: 12.5px; }
.run .r { color: var(--muted); font-size: 12.5px; text-align: right; }
.more { text-align: center; padding: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
#detail { padding: 22px 26px; }
#detail .t { font-size: 19px; font-weight: 600; margin: 0; }
#detail .m { color: var(--muted); font-size: 13.5px; margin: 2px 0 16px; }
.section { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; margin: 22px 0 8px; }
.result { max-width: 80ch; }
.result h1, .result h2, .result h3, .result h4 { color: var(--ink); letter-spacing: 0; margin: 1.2em 0 .4em; line-height: 1.4; }
.result h1 { font-size: 19px; } .result h2 { font-size: 17px; } .result h3, .result h4 { font-size: 15.5px; }
.result p { margin: .5em 0; }
.result ul, .result ol { padding-left: 1.4em; margin: .4em 0; }
.result li { margin: .2em 0; }
.result a { color: var(--run); word-break: break-all; }
.result code { background: var(--tint); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.result pre { background: var(--tint); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; line-height: 1.55; }
.result pre code { background: none; padding: 0; }
.result table { border-collapse: collapse; font-size: 13.5px; margin: .6em 0; display: block; overflow-x: auto; }
.result th, .result td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.result hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.errbox { background: var(--tint); border-left: 3px solid var(--bad); padding: 10px 14px; border-radius: 6px; }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { position: relative; padding: 0 0 14px 26px; }
.steps li::before { content: ""; position: absolute; left: 6px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.steps li::after { content: ""; position: absolute; left: 10px; top: 22px; bottom: 2px; width: 1px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps li.think::before { background: var(--run); }
.steps li.tool::before { background: var(--ok); }
.steps li.error::before { background: var(--bad); }
.steps .h { font-weight: 500; }
.steps .h small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.steps .sub { color: var(--soft); font-size: 13.5px; }
.steps details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.steps pre, .raw pre { background: var(--tint); padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
             font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 300px; overflow: auto; margin: 6px 0 0; }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.menu label.plain { display: flex; gap: 8px; align-items: center; color: var(--soft); font-size: 13px; }
.menu .plain small { color: var(--muted); margin-left: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; margin-left: -120px; width: 240px; text-align: center; background: var(--ink); color: var(--bg);
         padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); }
details.raw { margin-top: 22px; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 40px 20px; text-align: center; }

/* ── 編輯表單 ── */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--elev); color: var(--ink); padding: 0;
         width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-h { padding: 18px 22px 0; font-size: 18px; font-weight: 600; }
.dlg-b { padding: 8px 22px; overflow: auto; }
.dlg-f { padding: 14px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; border-top: 1px solid var(--line); }
.dlg-f .err { flex: 1; color: var(--bad); font-size: 13.5px; }
.row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; margin: 12px 0; }
.row > label { color: var(--soft); font-size: 13.5px; padding-top: 8px; }
.row .inl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .inl > select, .row .inl > input { flex: 0 1 auto; }
.row .full { width: 100%; }
.row .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; }
.skills label { display: flex; gap: 6px; align-items: baseline; font-size: 14px; cursor: pointer; padding: 3px 0; }
.skills small { color: var(--muted); font-size: 11.5px; }
@media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 4px; } .row > label { padding-top: 0; } }
/* 模型下拉：不用瀏覽器內建的 datalist（macOS 的 WebView 只在打字時才出現、而且會依已填的文字過濾掉其他選項） */
input[data-list] { padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.combo-menu { position: fixed; z-index: 1000; max-height: 260px; overflow-y: auto; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; font-size: 13.5px; }
.combo-menu div { padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo-menu div.on, .combo-menu div:hover { background: var(--accent); color: var(--accent-ink); }
.combo-menu .empty { color: var(--muted); cursor: default; }
.combo-menu .empty:hover { background: none; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>自動化工作流</h1>
    <div id="update-bar" hidden style="background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:8px;margin:0 0 12px"></div>
    <div class="sumrow"><div class="summary" id="summary">讀取中…</div>
      <div class="dd"><button class="ghost" data-toggle="model-menu" id="model-btn" style="padding:4px 10px;font-size:13px">模型狀態 ▾</button>
        <div class="menu right" id="model-menu" style="min-width:320px;max-width:420px"></div></div></div>
  </header>

  <nav class="tabs" id="tabs"><button class="on" data-tab="wf">工作流</button><button data-tab="skills">Skills</button><button data-tab="settings">設定</button><span class="tab-ind" id="tab-ind"></span></nav>
  <div id="view-wf">
  <div class="panel bar" id="bar">
    <div class="dd" id="wf-dd">
      <button class="dd-btn" data-toggle="wf-menu"><span id="dd-label">全部工作流</span><span class="caret">▼</span></button>
      <div class="menu" id="wf-menu"></div>
    </div>
    <div class="info" id="wf-info"></div>
    <span id="wf-actions" style="display:contents"></span>
    <div class="dd">
      <button class="ghost" data-toggle="more-menu" aria-label="更多">⋯</button>
      <div class="menu right" id="more-menu"></div>
    </div>
  </div>

  <section id="now"></section>

  <div class="grid">
    <section>
      <h2 id="runs-title">最近的執行</h2>
      <div class="panel" id="runs"><div class="sel-ind" id="sel-ind"></div><div id="runs-list"></div></div>
    </section>
    <section>
      <h2>內容</h2>
      <div class="panel" id="detail"><div class="empty">還沒有執行紀錄</div></div>
    </section>
  </div>
  </div>
  <div id="view-skills" hidden>
    <div class="panel bar">
      <div class="dd">
        <button class="dd-btn" data-toggle="import-menu" style="min-width:0">匯入 skill <span class="caret">▼</span></button>
        <div class="menu" id="import-menu">
          <span class="plain" data-imp="file">上傳檔案<small>.zip、SKILL.md 或 .py</small></span>
          <span class="plain" data-imp="github">從 GitHub 網址匯入</span>
        </div>
      </div>
      <button class="ghost" data-sk-builder>用對話建立 skill</button>
      <div class="info">知識型 skill（SKILL.md）是給模型看的做事方法；工具型 skill（.py）是模型能呼叫的動作。</div>
      <input type="file" id="sk-file" accept=".zip,.md,.py" hidden>
    </div>
    <div class="sk-grid">
      <section><h2>已安裝的 skill</h2><div class="panel" id="sk-list"></div></section>
      <section><h2 id="sk-panel-title">內容</h2><div class="panel" id="sk-panel"><div class="empty">選一個 skill，或匯入、用對話建立一個</div></div></section>
    </div>
  </div>
  <div id="view-settings" hidden><form id="st-form" autocomplete="off"></form></div>
</div>

<dialog id="editor">
  <form method="dialog" id="ed-form">
    <div class="dlg-h" id="ed-title">編輯工作流</div>
    <div class="dlg-b">
      <div class="row"><label>名稱</label><input type="text" class="full" name="title" required></div>
      <div class="row" id="ed-name-row"><label>代號</label><div>
        <input type="text" class="full" name="name" placeholder="例如 disk-watch" pattern="[a-z0-9][a-z0-9-]*">
        <div class="hint">英文小寫、數字、連字號，建立後不能改；也是檔名</div></div></div>
      <div class="row"><label>說明</label><div><input type="text" class="full" name="description" placeholder="一句話說它解決什麼問題"><div class="hint">也會一起交給模型，網址、repo 這類目標可以寫這裡</div></div></div>
      <div class="row"><label>什麼時候跑</label><div class="inl">
        <select name="sched_kind">
          <option value="manual">手動執行</option><option value="daily">每天固定時間</option><option value="every">每隔一段時間</option>
        </select>
        <input type="time" name="daily" value="08:00">
        <span class="inl" id="ed-every"><select name="every">
          <option value="15">15 分鐘</option><option value="30">30 分鐘</option><option value="60">1 小時</option>
          <option value="120">2 小時</option><option value="360">6 小時</option><option value="720">12 小時</option>
        </select></span>
        <label class="switch" id="ed-enabled"><input type="checkbox" name="enabled"><span class="tr"></span>啟用排程</label>
      </div></div>
      <div class="row"><label>模型</label><div class="inl">
        <select name="provider"></select>
        <select name="model"></select>
      </div></div>
      <div class="row"><label>連不上時</label><div class="inl"><select name="fallback"></select><select name="fallback_model"></select></div></div>
      <div class="row"><label>篇幅與深度</label><div id="ed-depth"></div></div>
      <div class="row"><label>能做的事</label><div class="skills" id="ed-skills"></div></div>
      <div class="row"><label>任務說明</label><div>
        <textarea name="task" rows="8" placeholder="一步一步寫清楚要做什麼、每步用哪個能力、什麼情況才通知"></textarea>
        <div class="hint">手動執行時輸入框裡的文字，會以「額外輸入」附在最後</div></div></div>
      <details style="margin:8px 0 4px"><summary class="muted" style="cursor:pointer;font-size:13.5px">進階</summary>
        <div class="row"><label>角色設定</label><textarea name="system" rows="3"></textarea></div>
        <div class="row"><label>單輪最多輸出</label><div class="inl"><input type="number" name="max_tokens" min="256" max="65536" style="width:110px" placeholder="預設">
          <span class="muted" style="font-size:12.5px">tokens；留空用「設定 → 執行限制」的值</span></div></div>
        <div class="row"><label>最多步數</label><div class="inl"><input type="number" name="max_steps" min="1" max="40" style="width:90px">
          <span class="muted" style="font-size:12.5px">超過就視為失敗，避免 agent 繞圈子</span></div></div>
      </details>
    </div>
    <div class="dlg-f"><span class="err" id="ed-err"></span>
      <button type="button" class="ghost" id="ed-cancel">取消</button><button type="submit" id="ed-save">儲存</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);

// ── 動態：照 Dynamization（~/Dynamization-src）的 token 與配方 ──────────
// 執行環境：WAAPI，第 2 層（可中斷、速度歸零）→ 從「當下的值」重新出發，彈簧 b ≤ 0.15
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const E = {out: "cubic-bezier(.25,.1,.35,1)", in: "cubic-bezier(.4,0,1,1)"};
function bake(Dv, b, N = 20) {            // spring.md §4 閉式解 + §5 取樣；時長用 t_settle，不是 Dv（errata A2）
  const z = 1 - b, w = 2 * Math.PI / Dv;
  const d = z < 1
    ? (t => { const wd = w * Math.sqrt(1 - z * z); return Math.exp(-z * w * t) * (-Math.cos(wd * t) - (z * w / wd) * Math.sin(wd * t)); })
    : (t => -Math.exp(-w * t) * (1 + w * t));
  let T = 0;
  for (let t = 0; t < Dv * 6; t += 0.0005) if (Math.abs(d(t)) >= 0.005) T = t;
  T = Math.round((T + 0.0005) * 100) / 100;
  const pts = []; for (let i = 0; i <= N; i++) pts.push(i === N ? 1 : +(1 + d(i / N * T)).toFixed(4));
  return {duration: Math.round(T * 1000), easing: `linear(${pts.join(", ")})`};
}
const S = {                                 // recipes §0 的 token；micro 依配方 §4 用 spring(0.15, 0)
  micro: bake(0.15, 0), enter: bake(0.3, 0.15), layout: bake(0.35, 0), page: bake(0.5, 0.1),
  menu: bake(0.25, 0.1), dialog: bake(0.28, 0.1),
};
const T = {feedback: {duration: 120, easing: E.out}, lumin: {duration: 130, easing: E.out},
           fade: {duration: 250, easing: E.out}, fadeFast: {duration: 150, easing: E.out}, exit: {duration: 150, easing: E.in}};
// 給 CSS 用的同一組 token
for (const [k, v] of Object.entries({micro: S.micro, layout: S.layout}))
  document.documentElement.style.setProperty(`--e-${k}`, v.easing), document.documentElement.style.setProperty(`--d-${k}`, v.duration + "ms");
for (const [k, v] of Object.entries({feedback: T.feedback, lumin: T.lumin}))
  document.documentElement.style.setProperty(`--d-${k}`, v.duration + "ms");
document.documentElement.style.setProperty("--e-out", E.out);

// 同一個通道只留一條動畫：先把當下的值寫回元素再取消，新動畫從那裡出發（waapi.md「Interruption」）
function anim(el, kf, opts, id) {
  if (!el) return null;
  const pe = opts.pseudoElement || null;
  for (const a of el.getAnimations({subtree: true}))
    if (a.id === id && a.effect?.target === el && (a.effect.pseudoElement || null) === pe) {
      if (!pe) { try { a.commitStyles(); } catch {} }
      a.cancel();
    }
  const a = el.animate(kf, {fill: "both", ...opts}); a.id = id;
  return a;
}
// 位移/縮放在減少動態時拿掉，不透明度保留
const move = (el, kf, opts) => reduced.matches ? null : anim(el, kf, opts, "move");
const fade = (el, kf, opts) => anim(el, kf, opts, "fade");
function enterEl(el, delay = 0, dy = 8) {           // 配方 §1
  fade(el, {opacity: [0, 1]}, {...T.fade, delay});
  move(el, {transform: [`translateY(${dy}px)`, "none"]}, {...S.enter, delay});
}
function settle(el) {                                // 動畫結束後把 fill 拿掉，免得一直掛在元素上（waapi.md「Fill」）
  for (const a of el.getAnimations()) a.finished.then(() => { try { a.commitStyles(); } catch {} a.cancel(); }, () => {});
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DEPTH = [], runDepth = {}, runModel = {};   // runModel：這次執行臨時換的模型（「來源|模型」），只算下一次                  // 篇幅與深度的等級；runDepth：這次執行臨時調的（只在這個工作流、這次）
let WF = {}, WFS = [], PROV = {}, SKILLS = [], selWf = null, selRun = null, showAll = false, lastSig = {}, editing = null;

// ── 白話化 ─────────────────────────────────────────
const STATUS = {success: ["成功", "ok"], failed: ["失敗", "bad"], running: ["執行中", "run"], interrupted: ["中斷", "warn"],
                cancelled: ["已停止", "warn"]};
const PROVIDER = {auto: "自動", lmstudio: "本機", deepseek: "DeepSeek", claude: "Claude 訂閱", codex: "ChatGPT 訂閱", gemini: "Gemini"};

const provLabel = p => PROV[p]?.label || SETTINGS?.providers?.[p]?.label || PROVIDER[p] || p;
function modelName(id, provider) {
  if (provider === "auto") return "自動模式";
  id = id || PROV[provider]?.default_model || "";
  let name = id;
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  if (/^deepseek-chat/.test(id)) name = "DeepSeek V3";
  else if (/^deepseek-reasoner/.test(id)) name = "DeepSeek R1";
  // 訂閱的模型要分得出來：GPT-6-Luna 和 GPT-5.6-Terra 不能都縮成「Gpt」
  else if (/^gpt-/i.test(id)) name = "GPT-" + id.slice(4).split("-").map(cap).join("-");
  else if (/^(sonnet|opus|haiku)$/i.test(id)) name = "Claude " + cap(id.toLowerCase());
  else if (/^claude-[a-z]+-\d+(-\d{1,2})?(-\d{8})?$/i.test(id)) {       // claude-opus-4-8 → Claude Opus 4.8
    const [, fam, a, b] = id.match(/^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?/i);
    name = `Claude ${cap(fam)} ${a}${b ? "." + b : ""}`;
  }
  else if (/^(claude|gemini)-/i.test(id)) name = id.split("-").map(cap).join(" ");
  else {
    // 本機模型：名字 + 版本 + 大小（qwen3.5-35b-a3b → Qwen3.5 35B-A3B、gemma-4-e2b → Gemma 4 E2B）；
    // 縮不出版本或大小就顯示完整 ID，不同模型才不會變成同一個名字
    const g = id.match(/^([a-z]+)([\d.]*)(?:[-_](\d+(?:\.\d+)?)(?=[-_]|$))?(?:[-_]((?:e?\d+(?:\.\d+)?b)(?:-a\d+b)?))?/i);
    name = g && (g[2] || g[3] || g[4]) ? cap(g[1]) + (g[2] || "") + (g[3] ? " " + g[3] : "") + (g[4] ? " " + g[4].toUpperCase() : "")
         : id.length > 40 ? id.slice(0, 24) + "…" + id.slice(-15) : id;          // 頭尾都留：差別常在結尾（@q4_k / @bf16）
  }
  return name ? `${name}（${provLabel(provider)}）` : provLabel(provider);
}
function dur(sec) {
  if (sec == null) return "";
  sec = Math.round(sec);
  if (sec < 60) return `${sec} 秒`;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m < 60 ? `${m} 分${s ? " " + s + " 秒" : ""}` : `${Math.floor(m/60)} 小時 ${m%60} 分`;
}
function when(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000), now = new Date(), diff = (now - d) / 1000;
  const hm = d.toLocaleTimeString("zh-TW", {hour: "2-digit", minute: "2-digit", hour12: false});
  if (diff >= 0 && diff < 60) return "剛剛";
  if (diff >= 0 && diff < 3600) return `${Math.floor(diff/60)} 分鐘前`;
  const day = new Date(d); day.setHours(0,0,0,0); const today = new Date(); today.setHours(0,0,0,0);
  const dd = Math.round((day - today) / 86400000);
  return (dd === 0 ? "今天 " : dd === -1 ? "昨天 " : dd === 1 ? "明天 " : `${d.getMonth()+1}/${d.getDate()} `) + hm;
}
const wfTitle = n => WF[n]?.title || (String(n).startsWith("skill:") ? `試用：${n.slice(6)}` : n);
const isManual = s => !s || (!s.daily && !s.every_minutes);
function schedText(s) {
  if (isManual(s)) return "手動執行";
  if (s.daily) return `每天 ${s.daily}`;
  return s.every_minutes % 60 === 0 ? `每 ${s.every_minutes/60} 小時` : `每 ${s.every_minutes} 分鐘`;
}
function humanError(e) {
  e = e || "";
  if (/^Traceback/.test(e)) e = e.trim().split("\n").pop();   // 舊紀錄存的是整段 traceback，只取最後一行
  e = e.replace(/^\w*Error: /, "");
  if (/DEEPSEEK_API_KEY/.test(e)) return "DeepSeek 還沒設定 API key，所以連不上。";
  if (/timed out/i.test(e)) return "模型太久沒有回應（逾時）。通常是讀進去的內容太多。";
  if (/max_steps/.test(e)) return "步驟用完了還沒做完，agent 可能在繞圈子。看下面的過程，通常是一直重試同一件失敗的事。";
  if (/Connection refused|URLError/.test(e)) return "連不上模型伺服器，LM Studio 可能沒開。";
  return e;
}
function parseArgs(a) { try { return typeof a === "string" ? JSON.parse(a || "{}") : (a || {}); } catch { return {}; } }
const base = p => String(p || "").split("/").filter(Boolean).pop() || p;
const host = u => { try { const x = new URL(u); return x.host + (x.pathname.length > 1 ? x.pathname : ""); } catch { return u; } };

const SKILL_TEXT = {
  read_rss:        a => ["讀取新聞來源", host(a.url)],
  fetch_url:       a => ["打開網頁", host(a.url)],
  http_check:      a => ["檢查網站是否正常", host(a.url)],
  system_status:   a => ["檢查這台電腦的狀態", (a.processes || []).length ? "確認 " + a.processes.join("、") + " 有沒有在跑" : ""],
  tail_file:       a => ["讀取檔案", base(a.path)],

function resultSummary(name, out) {

  if (name === "http_check") return {err: !out.startsWith("OK"), text: out.split("\n")[0].replace(/^(OK|DOWN|PROBLEM) \S+：/, m => m.startsWith("OK") ? "正常，" : "異常，")};

// ── 小型 Markdown ────────────────────────────────
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const lines = String(src || "").replace(/\r/g, "").split("\n"); let html = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++;
      html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1] || "")) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = row(l); i += 2; let body = "";
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body += "<tr>" + row(lines[i++]).map(c => `<td>${c}</td>`).join("") + "</tr>";
      html += `<table><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr>${body}</table>`; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { html += "<hr>"; i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ol = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let it = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) it += "\u0000" + lines[i++].trim();
        items.push(it); }
      html += (ol ? "<ol>" : "<ul>") + items.map(t => `<li>${t.split("\u0000").map(inline).join("<br>")}</li>`).join("") + (ol ? "</ol>" : "</ul>"); continue; }
    if (!l.trim()) { i++; continue; }
    let para = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s|\s*\|)/.test(lines[i])) para.push(lines[i++]);
    html += `<p>${para.map(inline).join("<br>")}</p>`;
  }
  return html;
}

// 傳輸層：原生視窗裡直接呼叫 Python（不開 port、不經過網路）；在瀏覽器裡（headless 模式）才用 HTTP
const NATIVE = () => !!window.pywebview?.api?.request;

  const bin = r.b64 ? Uint8Array.from(atob(r.b64), c => c.charCodeAt(0)) : null;
  return {ok: r.status < 400, status: r.status,
          headers: {get: k => (r.headers || {})[k] ?? null},
          json: async () => r.json ?? JSON.parse(r.text || "null"),

}

function depthBurst(input, v) {

// ── 匯出 ───────────────────────────────────────────
let exportSteps = false, DETAIL = null;
function exportDoc(d, withSteps) {
  const r = d.run, title = wfTitle(r.workflow), st = STATUS[r.status][0];
  const started = new Date(r.started * 1000);
  const stamp = started.toLocaleString("zh-TW", {year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false});
  const meta = `${stamp} ${{schedule: "排程", cli: "命令列"}[r.trigger] || "手動"}執行 · ${st}` +
    (r.finished ? ` · 花了 ${dur(r.finished - r.started)}` : "") + ` · ${modelName(r.model, r.provider)}`;
  let body = r.output || (r.error ? `**沒有完成：** ${humanError(r.error)}` : "（沒有產出）");
  let mdText = `# ${title}\n\n${meta}\n\n---\n\n${body}\n`;
  if (withSteps) {
    const lines = [];
    for (const s of d.steps) {
      if (s.kind === "tool") { const [v, o] = describe(s.name, s.input); const x = resultSummary(s.name, s.output);
        lines.push(`${lines.length + 1}. ${v}${o ? "：" + o : ""} — ${x.err ? "失敗，" : ""}${x.text}`); }
      else if (s.kind === "error") lines.push(`${lines.length + 1}. ${s.name === "cancelled" ? "使用者停止" : "出錯"} — ${humanError(s.output)}`);
    }
    if (lines.length) mdText += `\n---\n\n## 執行過程\n\n${lines.join("\n")}\n`;
  }
  const pad = n => String(n).padStart(2, "0");
  const fname = `${title.replace(/[\\/:*?"<>|\s]+/g, "-")}-${started.getFullYear()}${pad(started.getMonth()+1)}${pad(started.getDate())}-${pad(started.getHours())}${pad(started.getMinutes())}`;
  const html = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
body{font:15px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#1c1c1a;max-width:780px;margin:40px auto;padding:0 24px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:19px;margin:1.4em 0 .4em}h3,h4{font-size:16px;margin:1.2em 0 .3em}
h1+p{color:#6b6b66;font-size:13.5px;margin-top:0}a{color:#2a5fc4;word-break:break-all}
code{background:#f0efea;padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Menlo,monospace}
pre{background:#f0efea;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace}
pre code{background:none;padding:0}table{border-collapse:collapse;margin:.6em 0}th,td{border:1px solid #cfcdc6;padding:6px 10px;text-align:left;vertical-align:top}
th{background:#f0efea}hr{border:0;border-top:1px solid #e4e2dc;margin:1.4em 0}
@media print{body{margin:0 auto}a{color:inherit}pre,table,li{break-inside:avoid}}
</style></head><body>${md(mdText)}</body></html>`;
  const txt = mdText.replace(/^#+\s*/gm, "").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1").replace(/^---$/gm, "────────");
  return {fname, mdText, html, txt};
}
function toast(msg, ms = 2500) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  enterEl(t);
  t.leave = () => { fade(t, {opacity: [0]}, T.exit); move(t, {transform: ["translateY(4px)"]}, T.exit); setTimeout(() => t.remove(), 160); };
  if (ms) setTimeout(t.leave, ms);
  return t;
}
async function save(blob, name) {
  if (NATIVE()) {                                   // 原生視窗沒有下載列：用系統的「儲存」對話框
    const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
    const where = await window.pywebview.api.save_file(name, b64);
    if (where) toast(`已存到 ${where}`);
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function doExport(fmt) {
  const d = DETAIL; if (!d) return;
  const x = exportDoc(d, exportSteps);
  const types = {md: "text/markdown", html: "text/html", txt: "text/plain", json: "application/json"};
  if (fmt in types) {
    const content = fmt === "md" ? x.mdText : fmt === "html" ? x.html : fmt === "txt" ? x.txt : JSON.stringify(d, null, 2);
    return save(new Blob([content], {type: types[fmt] + ";charset=utf-8"}), `${x.fname}.${fmt}`);
  }
  const t = toast(fmt === "pdf" ? "正在產生 PDF…" : "正在產生 Word 檔…", 0);
  try {
    const r = await apiFetch("/api/export", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({format: fmt, html: x.html, filename: `${x.fname}.${fmt}`})});
    if (!r.ok) throw new Error((await r.json()).error);
    save(await r.blob(), `${x.fname}.${r.headers.get("X-Export-Ext") || fmt}`);
  } catch (e) { toast(e.message || "匯出失敗", 4000); }
  finally { t.leave(); }
}

// ── 現在：即時動作與思考 ─────────────────────────────
const liveSteps = {};
const livePrev = {};                                  // 上一次畫面：用來判斷什麼是「新的」才需要動
let nowShown = false;
async function loadLive() {
  const live = await j("/api/live");
  const box = $("#now");
  if (!live.length) {
    if (nowShown) {                                    // 整區退場，然後才清掉（計時器，不綁 finished）
      nowShown = false;
      fade(box, {opacity: [0]}, T.exit); move(box, {transform: ["translateY(4px)"]}, T.exit);
      setTimeout(() => { if (!nowShown) { box.innerHTML = ""; fade(box, {opacity: [1]}, {duration: 0}); move(box, {transform: ["none"]}, {duration: 0}); } }, 160);
    }
    return false;
  }
  for (const L of live) {
    if (!liveSteps[L.run_id] || liveSteps[L.run_id].round !== L.round || L.phase === "waiting")
      liveSteps[L.run_id] = {round: L.round, steps: (await j("/api/runs/" + L.run_id)).steps};
  }
  const stick = Object.fromEntries([...document.querySelectorAll(".stream[data-k]")]
    .map(e => [e.dataset.k, e.scrollHeight - e.scrollTop - e.clientHeight < 30]));
  $("#now").innerHTML = `<h2>現在</h2>` + live.map(L => {
    const steps = liveSteps[L.run_id].steps;
    const el = Math.max(0, Date.now() / 1000 - (L.since || L.started));
    let what, stream = "", label;
    if (L.phase === "tool" || L.phase === "deciding") {
      const [v, o] = describe(L.tool?.name, L.tool?.args);
      label = v; what = (L.phase === "tool" ? "正在" : "決定要") + v + (o ? `：${o}` : "");
    } else if (L.phase === "thinking") {
      label = "思考"; what = "正在思考";
      stream = `<div class="stream-label">思考內容（即時）</div><div class="stream" data-k="${L.run_id}">${esc(L.reasoning)}</div>`;
    } else if (L.phase === "writing") {
      label = "寫結果"; what = "正在寫結果";
      stream = `<div class="stream-label">正在寫的內容（即時）</div><div class="stream" data-k="${L.run_id}">${esc(L.content)}</div>`;
    } else {
      label = "讀資料"; what = L.round === 1 ? "正在閱讀任務說明" : "正在消化剛才拿到的資料";
    }
    const max = WF[L.workflow]?.max_steps || 12, pct = Math.min(100, L.round / max * 100);
    const idle = L.phase === "waiting" ? 0 : Date.now() / 1000 - (L.last_token || L.since || L.started);
    const written = (L.content || "").length + (L.reasoning || "").length;
    const stuck = L.broken ? `<div class="errbox" style="margin-top:10px">${esc(L.broken)}</div>` : idle > (SETTINGS?.limits?.stall_seconds || 45)
      ? `<div class="errbox" style="margin-top:10px">已經 ${dur(idle)} 沒有新的輸出${written ? `（目前只寫了 ${written} 字）` : ""}，模型可能卡住了。
         可以按右上角的「停止」；就算不管它，單輪最多也只會寫 ${WF[L.workflow]?.max_tokens || SETTINGS?.limits?.max_tokens || 4096} tokens。</div>` : "";
    // 最近的動作：連續相同的合併成一行
    const acts = steps.filter(s => s.kind !== "llm" && s.kind !== "note"), groups = [];
    for (const s of acts) {
      const key = s.kind === "tool" ? s.name + (resultSummary(s.name, s.output).err ? "!" : "") : "err";
      const g = groups[groups.length - 1];
      if (g && g.key === key) { g.n++; g.last = s; } else groups.push({key, n: 1, last: s});
    }
    L._groups = groups.length; L._what = L.phase + "|" + label; L._pct = pct;   // 只有動作換了才算「換字」，補上網址不算
    const prevPct = livePrev[L.run_id]?.pct ?? pct;
    const recent = groups.slice(-4).map(g => g.n === 1 ? actRow(g.last, false)
      : actRow(g.last, false).replace(/— /, `×${g.n}${g.key.endsWith("!") ? "，全部失敗" : ""}，最後一次 — `)).join("");
    return `<div class="live">
      <div class="live-head"><span class="t">${esc(L.title)}</span>
        <span class="m">已經跑了 ${dur(Date.now()/1000 - L.started)} · ${esc(modelName(L.model, L.provider))}
        <button class="ghost" data-stop-live="${esc(L.workflow)}" style="margin-left:8px;padding:3px 10px;color:var(--bad)">停止</button></span></div>
      <div class="now-what"><span class="pulse"></span><span>${esc(what)}</span><span class="sec">${dur(el) || "0 秒"}</span></div>
      <div class="prog"><span>第 ${L.round} 輪，最多 ${max} 輪</span><div class="pb"><div class="${pct >= 75 ? "hot" : ""}" data-pct="${pct}" style="transform:scaleX(${prevPct / 100})"></div></div>
        ${pct >= 75 ? `<span class="warn-text">快到上限了</span>` : ""}</div>
      ${timeBar(steps, {sec: el, label, tool: L.phase === "tool"})}
      ${stuck}
      ${recent ? `<div class="recent acts" style="margin-left:0">${groups.length > 4 ? `<div class="muted" style="font-size:12.5px">…前面還有 ${groups.length - 4} 組動作</div>` : ""}${recent}</div>` : ""}
      ${stream}</div>`;
  }).join("");
  document.querySelectorAll(".stream[data-k]").forEach(e => { if (stick[e.dataset.k] !== false) e.scrollTop = e.scrollHeight; });
  // 每次輪詢都會重畫，所以「動」只給真的變了的東西
  if (!nowShown) { nowShown = true; enterEl(box); }
  box.querySelectorAll(".live").forEach((card, i) => {
    const L = live[i], p = livePrev[L.run_id];
    if (!p) enterEl(card, 60);                                                    // 新的一張：容器先到（A6）
    if (p && p.what !== L._what) {                                                 // 「正在做什麼」換了
      const w = card.querySelector(".now-what");
      fade(w, {opacity: [0.2, 1]}, T.fadeFast); move(w, {transform: ["translateY(4px)", "none"]}, S.micro);
    }
    if (p && L._groups > p.groups) enterEl(card.querySelector(".recent .act-row:last-of-type"));   // 新的一步
    // 進度條：從上一次的比例長到這一次（先有起始值，下一幀才改，errata A5）
    const bar = card.querySelector(".pb div");
    requestAnimationFrame(() => { bar.style.transform = `scaleX(${bar.dataset.pct / 100})`; });
    livePrev[L.run_id] = {what: L._what, groups: L._groups, pct: L._pct};
  });
  return true;
}

// ── 編輯表單 ───────────────────────────────────────
const F = () => $("#ed-form").elements;
function fillModels(provider, current) {
  if (provider === "auto") { F().model.innerHTML = `<option value="">由自動模式決定（設定 → 自動模式）</option>`; return; }
  const models = (PROV[provider]?.models || []).filter(m => !/embed/i.test(m));

  const def = PROV[provider]?.default_model;
  F().model.innerHTML = `<option value="">預設${def ? `（${esc(modelName(def, provider).replace(/（.*）$/, ""))}）` : ""}</option>` +
    models.map(m => `<option value="${esc(m)}" ${m === current ? "selected" : ""}>${esc(m)}</option>`).join("");

function fillFallback(provider, current) {
  if (provider === "auto") { F().fallback.innerHTML = `<option value="">不需要：自動模式會照順序換</option>`; return; }

let armedDelete = false;
const menuOpen = {};                                 // 邏輯狀態是布林值，動畫只是朝它跑（errata C2）
function openMenu(m) {
  menuOpen[m.id] = true;
  m.classList.add("open");
  fade(m, {opacity: [0, 1]}, T.fadeFast);
  move(m, {transform: ["translateY(-4px) scale(.95)", "none"]}, S.menu);
  // 容器先打開，項目才倒進來（feel.md §6）：從 Dv 開始錯開 0.03
  [...m.querySelectorAll(".item, .plain, .mi")].slice(0, 12).forEach((it, i) => {
    fade(it, {opacity: [0, 1]}, {...T.fadeFast, delay: 200 + i * 30});
    move(it, {transform: ["translateY(-3px)", "none"]}, {...S.micro, delay: 200 + i * 30});
  });
}
function closeMenu(m) {
  if (!menuOpen[m.id]) return;
  menuOpen[m.id] = false;
  // 內容先清空，容器才關上；退場比進場短、距離更短（金律 3）
  [...m.querySelectorAll(".item, .plain")].forEach(it => fade(it, {opacity: [0]}, {duration: 80, easing: E.in}));
  fade(m, {opacity: [0]}, {...T.exit, delay: 50});
  move(m, {transform: ["translateY(-2px) scale(.98)"]}, {...T.exit, delay: 50});
  // 移除用計時器，不綁在 finished 上（errata C1）
  setTimeout(() => { if (!menuOpen[m.id]) { m.classList.remove("open"); tick(); } }, 220);
}
function closeMenus(except) {
  document.querySelectorAll(".menu.open").forEach(m => { if (m.id !== except) closeMenu(m); });
  if (except !== "more-menu" && armedDelete) { armedDelete = false; lastSig.bar = null; }   // 取消確認時，按鈕文字也要回來
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#editor").open) closeMenus(); });
document.addEventListener("click", async e => {
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const m = document.getElementById(tg.dataset.toggle); closeMenus(m.id); menuOpen[m.id] ? closeMenu(m) : openMenu(m); return; }

  const pick = e.target.closest("[data-pick]");
  if (pick) { selWf = pick.dataset.pick || null; showAll = false; selRun = null; closeMenus(); lastSig = {}; tick(); return; }

  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "edit") { closeMenus(); openEditor(WF[selWf]); }
    else if (a === "new") { closeMenus(); openEditor(null); }
    else if (a === "delete") {
      if (!armedDelete) { armedDelete = true; act.textContent = `再點一次，刪除「${WF[selWf].title}」`; return; }
      const r = await post(`/api/workflows/${encodeURIComponent(selWf)}/delete`);
      closeMenus();
      if (!r.ok) { alertBar(r.error); return; }
      selWf = null; selRun = null; lastSig = {}; tick();
    }
    return;
  }
  if (!e.target.closest(".menu")) closeMenus();

  if (e.target.closest("[data-run]")) {
    const b = e.target.closest("[data-run]"), inp = document.querySelector("#wf-actions .runin");
    b.disabled = true;
    const [provider, model] = (runModel[selWf] || "|").split("|");
    const res = await post(`/api/workflows/${encodeURIComponent(selWf)}/run`,
      {input: inp?.value || "", depth: runDepth[selWf] ?? WF[selWf]?.depth ?? 3, ...(provider ? {provider, model} : {}), ...attachBody()});
    if (res.error) { toast(res.error); b.disabled = false; return; }
    delete runDepth[selWf]; delete runModel[selWf]; delete ATT[selWf];   // 臨時調的只算這一次，下次回到工作流的設定
    if (inp) { inp.value = ""; growRunin(inp); inp.blur(); }  // 離開輸入框：執行列才會重畫（按鈕、附件數字回到最新）
    setTimeout(async () => { selRun = (await j("/api/runs?workflow=" + encodeURIComponent(selWf)))[0]?.id; lastSig = {}; tick(); }, 400);
    return;
  }
  if (e.target.closest("[data-att-pick]")) {
    const path = await window.pywebview.api.pick_folder();
    if (path) { att().folder = path; refreshAttachMenu(); }
    return;
  }
  const ac = e.target.closest("[data-att-clear]");
  if (ac) { if (ac.dataset.attClear === "folder") att().folder = ""; else att().images = []; refreshAttachMenu(); return; }
  const ar = e.target.closest("[data-att-rm]");
  if (ar) { att().images.splice(+ar.dataset.attRm, 1); refreshAttachMenu(); return; }
  const cb = e.target.closest("[data-cont], [data-regen]");
  if (cb) {
    // 繼續：接著這筆紀錄的整段對話，用下面框裡的新輸入；重新生成：同樣的輸入和設定再跑一次
    const id = cb.dataset.cont || cb.dataset.regen, cont = !!cb.dataset.cont;
    const box = document.querySelector(".cont textarea");
    if (cont && !box?.value.trim() && !attCount(att())) { toast("先在框裡寫下要接著做什麼"); box?.focus(); return; }
    cb.disabled = true;
    const [provider, model] = (runModel[selWf] || "|").split("|");
    const res = await post(`/api/runs/${id}/${cont ? "continue" : "regenerate"}`,
      cont ? {input: box.value, ...(provider ? {provider, model} : {}), ...attachBody()} : {});
    if (res.error) { toast(res.error); cb.disabled = false; return; }
    if (cont) { delete ATT[selWf]; delete runModel[selWf]; box.value = ""; box.blur(); lastSig.bar = null; }
    toast(cont ? "已接著繼續，看上面「現在」那一區" : "已重新生成，看上面「現在」那一區");
    // 在「全部工作流」裡也可以繼續：沒選工作流時就看全部紀錄最新的那筆（不能送 workflow=null）
    setTimeout(async () => { selRun = (await j(selWf ? "/api/runs?workflow=" + encodeURIComponent(selWf) : "/api/runs"))[0]?.id; lastSig = {}; tick(); }, 400);
    return;
  }
  const mp = e.target.closest("[data-run-model]");
  if (mp) {
    if (mp.dataset.runModel) runModel[selWf] = mp.dataset.runModel; else delete runModel[selWf];
    closeMenus(); lastSig.bar = null; tick();
    return;
  }
  const rd = e.target.closest("[data-run-del]");
  if (rd) {
    // 跟刪工作流一樣：第一次點只是確認，再點一次才刪（不用瀏覽器的確認視窗）
    if (rd.dataset.armed !== "1") {
      rd.dataset.armed = "1";
      const saved = (DETAIL?.steps || []).filter(s => s.kind === "tool" && s.name === "save_report").length;
      rd.textContent = saved ? `再點一次：刪除紀錄和它存的 ${saved} 份報告` : "再點一次刪除這筆紀錄";
      setTimeout(() => { if (rd.isConnected) { rd.dataset.armed = ""; rd.textContent = "刪除"; } }, 4000);
      return;
    }
    rd.disabled = true;
    const r = await post(`/api/runs/${rd.dataset.runDel}/delete`, {});
    if (r.error) { toast(r.error); rd.disabled = false; return; }
    toast(r.moved_reports?.length ? `已刪除；${r.moved_reports.length} 份報告移到 reports/.trash` : "已刪除這筆紀錄");
    selRun = null; shownRun = null; lastSig = {}; tick();
    return;
  }
  const ex = e.target.closest("[data-export]");
  if (ex) { closeMenus(); doExport(ex.dataset.export); return; }
  if (e.target.id === "export-steps") { exportSteps = e.target.checked; lastSig.detail = null; return; }
  if (e.target.closest("#export-menu")) return;
  const sl = e.target.closest("[data-stop-live]");
  if (sl) { sl.disabled = true; sl.textContent = "停止中…"; await post(`/api/workflows/${encodeURIComponent(sl.dataset.stopLive)}/stop`); return; }
  if (e.target.closest("[data-stop]")) {
    const b = e.target.closest("[data-stop]"); b.disabled = true; b.textContent = "停止中…";
    await post(`/api/workflows/${encodeURIComponent(selWf)}/stop`);
    return;
  }
  if (e.target.closest("[data-more]")) { showAll = true; lastSig.runs = null; tick(); return; }
  const r = e.target.closest("[data-rid]");
  if (r) { selRun = +r.dataset.rid; lastSig.runs = null; lastSig.detail = null; tick(); }
});
document.addEventListener("focusout", e => { if (e.target.classList?.contains("runin")) setTimeout(tick, 0); });
document.addEventListener("change", async e => {
  if (e.target.matches("[data-enable]")) {
    const r = await post(`/api/workflows/${encodeURIComponent(selWf)}/enabled`, {enabled: e.target.checked});
    if (!r.ok) { e.target.checked = !e.target.checked; alertBar(r.error); }

function alertBar(msg) { $("#wf-info").innerHTML = `<span class="bad-text">${esc(msg || "發生錯誤")}</span>`; }

// ── 分頁 ───────────────────────────────────────────
let tab = "wf";
function placeTabInd(jump) {
  const b = document.querySelector(`#tabs [data-tab="${tab}"]`), ind = $("#tab-ind");
  const x = b.offsetLeft, w = b.offsetWidth;
  const to = `translateX(${x}px) scaleX(${w / 100})`;
  if (jump || reduced.matches) { ind.style.transform = to; return; }
  anim(ind, {transform: [to]}, S.layout, "move");          // 底線用 transform 滑過去，不動 width（B1）
}
const VIEWS = {wf: "#view-wf", skills: "#view-skills", settings: "#view-settings"};
async function switchTab(t) {
  if (t === tab) return;
  const from = $(VIEWS[tab]), to = $(VIEWS[t]);
  tab = t;
  document.querySelectorAll("#tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  placeTabInd();
  closeMenus();
  // 先離場再進場（配方 §23）
  fade(from, {opacity: [0]}, T.exit); move(from, {transform: ["translateY(-6px)"]}, T.exit);
  await new Promise(r => setTimeout(r, 150));
  if (tab !== t) return;
  from.hidden = true; to.hidden = false;
  fade(to, {opacity: [0, 1]}, T.fade); move(to, {transform: ["translateY(8px)", "none"]}, S.page);
  if (t === "skills") loadSkills(true);
  if (t === "settings") loadSettings();
}

function collectSettings() {
  const out = {providers: {}};
  document.querySelectorAll("#st-form [data-st]").forEach(el => {
    const v = el.dataset.bool !== undefined ? el.checked : el.type === "number" ? Number(el.value) : el.value;
    el.dataset.st.split(".").reduce((o, k, i, a) => i === a.length - 1 ? (o[k] = v) : (o[k] ??= {}), out);
  });
  document.querySelectorAll("#prov-list [data-prov]").forEach(card => {
    const n = card.dataset.prov, p = {...(SETTINGS.providers[n] || {})};
    card.querySelectorAll("[data-pf]").forEach(el => { p[el.dataset.pf] = el.type === "checkbox" ? el.checked : el.value; });
    if (card.dataset.clearKey) p.clear_key = true;
    out.providers[n] = p;
  });
  out.readable_paths = $("#st-paths").value.split("\n");
  out.local_fallback = {enabled: $("#lf-on").checked, provider: $("#lf-p").value, model: $("#lf-m").value};
  out.auto = {cli_max_utilization: Number($("#auto-thr").value) / 100,
    seen_models: SETTINGS.auto?.seen_models || [],      // 這頁載入時看過的；之後才自動加入的模型不算被刪
    order: [...document.querySelectorAll("#auto-list .auto-row")].map(r => Object.fromEntries(
      [...r.querySelectorAll("[data-af]")].map(el => [el.dataset.af, el.type === "number" ? Number(el.value) : el.value])))};
  return out;
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-prov-add]")) {
    let i = 1; while (SETTINGS.providers["custom" + i]) i++;
    const n = "custom" + i;
    SETTINGS.providers[n] = {label: "新的模型來源", base_url: "", needs_key: true, default_model: "", enabled: true};
    const div = document.createElement("div"); div.innerHTML = provCard(n, SETTINGS.providers[n]);
    const card = div.firstElementChild; $("#prov-list").appendChild(card); enterEl(card);
    card.querySelector('[data-pf="label"]').focus();
    return;
  }
  const del = e.target.closest("[data-prov-del]");
  if (del) {
    const card = del.closest("[data-prov]");
    delete SETTINGS.providers[del.dataset.provDel];
    fade(card, {opacity: [0]}, T.exit); move(card, {transform: ["translateY(4px)"]}, T.exit);
    setTimeout(() => card.remove(), 160);
    $("#st-msg").textContent = "記得按「儲存設定」";
    return;
  }
  const row = e.target.closest(".auto-row");
  if (e.target.closest("[data-auto-up]") && row.previousElementSibling) {
    const prev = row.previousElementSibling, dy = prev.offsetTop - row.offsetTop;
    row.parentNode.insertBefore(row, prev);                       // 換位置後用 FLIP 滑過去，不是瞬移
    move(row, {transform: [`translateY(${-dy}px)`, "none"]}, S.layout); move(prev, {transform: [`translateY(${dy}px)`, "none"]}, S.layout);
    return;
  }
  if (e.target.closest("[data-auto-down]") && row.nextElementSibling) {
    const next = row.nextElementSibling, dy = next.offsetTop - row.offsetTop;
    row.parentNode.insertBefore(next, row);
    move(row, {transform: [`translateY(${-dy}px)`, "none"]}, S.layout); move(next, {transform: [`translateY(${dy}px)`, "none"]}, S.layout);
    return;
  }
  if (e.target.closest("[data-auto-del]")) { fade(row, {opacity: [0]}, T.exit); setTimeout(() => row.remove(), 160); return; }
  if (e.target.closest("[data-auto-add]")) {
    // 挑一個還沒排進去的 (來源, 模型)：先看各來源的模型清單，再看還沒用過的來源
    const used = new Set([...document.querySelectorAll("#auto-list .auto-row")].map(r => {
      const p = r.querySelector('[data-af="provider"]').value;
      return `${p}/${r.querySelector('[data-af="model"]').value || SETTINGS.providers[p]?.default_model || ""}`; }));
    let pick = {provider: Object.keys(SETTINGS.providers)[0]};
    outer: for (const p of Object.keys(SETTINGS.providers)) {
      for (const m of [SETTINGS.providers[p].default_model || "", ...provModels(p)])
        if (!used.has(`${p}/${m}`)) { pick = {provider: p, model: m === SETTINGS.providers[p].default_model ? "" : m}; break outer; }
    }
    const div = document.createElement("div"); div.innerHTML = autoRow(pick); const r2 = div.firstElementChild;
    $("#auto-list").appendChild(r2); enterEl(r2); return;
  }
  const ck = e.target.closest("[data-key-clear]");
  if (ck) { const card = ck.closest("[data-prov]"); card.dataset.clearKey = "1"; ck.textContent = "儲存後清除"; ck.disabled = true; }
});

async function loadSkills(animate) {

async function showPanel(mode, html, title) {
  const p = $("#sk-panel");
  if (skMode !== null && skMode !== mode) {
    fade(p, {opacity: [0]}, T.exit); await new Promise(r => setTimeout(r, 130));
  }
  const changed = skMode !== mode;
  skMode = mode; $("#sk-panel-title").textContent = title; p.innerHTML = html;
  if (changed) { fade(p, {opacity: [0, 1]}, T.fade); move(p, {transform: ["translateY(8px)", "none"]}, S.enter); }
}

// 可用的 (來源, 模型)：每個來源先放「預設」，再放它的各個模型（Sonnet / Opus、各個 GPT 分開選）。值是「來源|模型」
function providerOptions() {
  const out = [];
  for (const [p, v] of Object.entries(PROV)) {
    if (!v.ok) continue;
    const lab = esc(v.label || PROVIDER[p] || p), d = v.default_model || "";
    out.push(`<option value="${p}|">${lab} · 預設${d ? `（${esc(shortName(d, p))}）` : ""}</option>`);
    for (const m of (v.models || []).filter(x => x !== d && !/embed/i.test(x)).slice(0, 12))
      out.push(`<option value="${p}|${esc(m)}">${lab} · ${esc(shortName(m, p))}</option>`);
  }
  return out.join("") || `<option value="">沒有可用的模型來源</option>`;
}
const pickModel = sel => { const [provider, model] = (sel?.value || "|").split("|"); return {provider, model}; };

async function doImport(body, msgEl) {

function builderHtml() {
  return `<div class="builder">
    <div>
      <div class="chat" id="b-chat">${builderMsgs.length ? builderMsgs.map(m => `<div class="bub ${m.role === "user" ? "u" : "a"}">${esc(m.role === "user" ? m.content : m.content.replace(/```(?:skill|markdown|md)?\s*\n---[\s\S]*?```/g, "（草稿已更新 →）"))}</div>`).join("")
        : `<div class="bub a">想做一個什麼樣的 skill？說說它要處理什麼、輸入是什麼、希望輸出長怎樣。例如：「把我貼的會議逐字稿整理成決議和待辦」。</div>`}</div>
      <div class="row2"><textarea id="b-in" rows="3" style="flex:1" placeholder="描述你想要的 skill，或要怎麼改（⌘/Ctrl + Enter 送出）"></textarea></div>
      <div class="row2"><select id="b-p">${providerOptions()}</select><button data-b-send>送出</button>
        <button class="ghost" data-b-reset>重新開始</button></div>
    </div>
    <div class="draft">
      <div class="muted" style="font-size:12.5px;margin-bottom:4px">SKILL.md 草稿（可以直接改）</div>
      <textarea id="b-draft" placeholder="構建器寫的草稿會出現在這裡">${esc(builderDraft)}</textarea>

function showBuilder() {
  skSel = null; document.querySelectorAll("#sk-list .sk").forEach(el => el.classList.remove("sel"));
  showPanel("builder", builderHtml(), "Skill 對話構建器");
  setTimeout(() => { const c = $("#b-chat"); if (c) c.scrollTop = c.scrollHeight; const s = $("#b-p"); if (s && PROV.claude?.ok) s.value = "claude|"; }, 0);
}
async function builderSend() {
  const inp = $("#b-in"), text = inp.value.trim();
  if (!text || builderBusy) return;
  builderBusy = true; inp.value = "";
  builderMsgs.push({role: "user", content: text}); saveBuilder();
  const chat = $("#b-chat");
  const u = document.createElement("div"); u.className = "bub u"; u.textContent = text; chat.appendChild(u); enterEl(u, 0, 6);
  const w = document.createElement("div"); w.className = "bub a wait"; w.innerHTML = `<span class="pulse"></span>正在寫…`; chat.appendChild(w); enterEl(w, 80, 6);
  chat.scrollTop = chat.scrollHeight;
  $("[data-b-send]").disabled = true;
  const r = await post("/api/builder/chat", {messages: builderMsgs, ...pickModel($("#b-p"))});
  builderBusy = false;
  if (skMode !== "builder") return;
  $("[data-b-send]").disabled = false;
  w.remove();
  const a = document.createElement("div"); a.className = "bub a";
  if (!r.ok) { a.innerHTML = `<span class="bad-text">${esc(r.error || "失敗")}</span>`; builderMsgs.pop(); saveBuilder(); }
  else {
    builderMsgs.push({role: "assistant", content: r.reply});
    a.textContent = r.reply.replace(/```(?:skill|markdown|md)?\s*\n---[\s\S]*?```/g, "（草稿已更新 →）");
    if (r.draft) {
      builderDraft = r.draft; const ta = $("#b-draft"); ta.value = r.draft;
      fade(ta, {opacity: [0.35, 1]}, T.fade);                // 草稿換了：亮度先到（lumin 比位移快）
      $("[data-b-save]").disabled = false;
    }
    saveBuilder();
  }
  chat.appendChild(a); enterEl(a, 0, 6); chat.scrollTop = chat.scrollHeight;
}

document.addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]"); if (tb) { switchTab(tb.dataset.tab); return; }
  const go = e.target.closest("[data-goto]"); if (go) { e.preventDefault(); closeMenus(); switchTab(go.dataset.goto); return; }
  const wr = e.target.closest("[data-welcome-run]");
  if (wr) {                                         // 從引擎頁直接執行：選中那條，手動的就把輸入框交給使用者
    selWf = wr.dataset.welcomeRun; lastSig = {}; await tick();
    const w = WF[selWf];
    if (isManual(w.schedule)) { document.querySelector("#wf-actions .runin")?.focus(); toast("在上面的輸入框寫下要處理什麼，再按「立即執行」"); }
    else document.querySelector("#wf-actions [data-run]")?.click();
    return;
  }
  const sk = e.target.closest("[data-sk]"); if (sk) { showSkill(sk.dataset.sk); return; }
  const imp = e.target.closest("[data-imp]");
  if (imp) { closeMenus(); imp.dataset.imp === "file" ? $("#sk-file").click() : showGithub(); return; }
  if (e.target.closest("[data-gh-go]")) { doImport({type: "github", url: $("#gh-url").value}, "#gh-msg"); return; }
  if (e.target.closest("[data-py-cancel]")) { pendingPy = null; skMode = null; $("#sk-panel").innerHTML = '<div class="empty">已取消</div>'; return; }
  if (e.target.closest("[data-py-go]")) {
    const f = pendingPy; if (!f) return;
    doImport({type: "file", filename: f.name, content: await b64(f), confirm_code: $("#py-ok").checked}, "#py-msg"); return;
  }
  if (e.target.closest("[data-sk-builder]")) { showBuilder(); return; }
  if (e.target.closest("[data-b-send]")) { builderSend(); return; }
  if (e.target.closest("[data-b-reset]")) { builderMsgs = []; builderDraft = ""; saveBuilder(); skMode = null; showBuilder(); return; }
  if (e.target.closest("[data-b-save]")) {
    const r = await post("/api/builder/save", {draft: $("#b-draft").value});
    if (!r.ok) { $("#b-msg").innerHTML = `<span class="bad-text">${esc(r.error)}</span>`; return; }
    await loadSkills(false); toast(`已存成 skill：${r.name}`);
    builderMsgs = []; builderDraft = ""; saveBuilder(); showSkill(r.name); return;
  }
  const tr = e.target.closest("[data-sk-try]");
  if (tr) {
    const input = $("#sk-try-in").value.trim(); if (!input) { $("#sk-try-in").focus(); return; }
    tr.disabled = true;
    const r = await post(`/api/skills/${encodeURIComponent(tr.dataset.skTry)}/run`, {input, ...pickModel($("#sk-try-p"))});
    tr.disabled = false;
    if (!r.ok) { toast(r.error || "無法執行", 4000); return; }
    // 到工作流分頁看它跑
    selWf = null; showAll = false; lastSig = {};
    await switchTab("wf");
    setTimeout(async () => { selRun = (await j("/api/runs?workflow=" + encodeURIComponent(r.workflow)))[0]?.id; lastSig = {}; tick(); }, 400);
    return;
  }
  const mk = e.target.closest("[data-sk-wf]");
  if (mk) {
    const s = SKILLS.find(x => x.name === mk.dataset.skWf);
    const k = s.kind === "knowledge";
    openEditor(null, {
      name: s.name.replace(/_/g, "-"), title: s.title || s.name, description: s.description.slice(0, 120),
      provider: firstProvider(), skills: k ? ["use_skill", "read_skill_file", "web_search", "fetch_url", "save_report"] : [s.name],
      system: k ? `你是自動執行任務的 agent，一律用繁體中文（台灣）。一開始先用 use_skill 載入「${s.name}」，照它的指示做事。` : undefined,
      task: "（寫下這個工作流每次要做的事；手動執行時輸入框的文字會附在最後）"});
    return;
  }
  const del = e.target.closest("[data-sk-del]");
  if (del) {
    if (!del.dataset.armed) { del.dataset.armed = "1"; del.textContent = "再點一次確定"; return; }
    const r = await post(`/api/skills/${encodeURIComponent(del.dataset.skDel)}/delete`);
    if (!r.ok) { toast(r.error, 4000); return; }
    skSel = null; skMode = null; $("#sk-panel").innerHTML = '<div class="empty">已刪除（移到 skills/.trash）</div>';
    await loadSkills(false); return;
  }
});
document.addEventListener("change", async e => {
  if (e.target.id === "py-ok") { const b = $("[data-py-go]"); if (b) b.disabled = !e.target.checked; }
  if (e.target.id === "sk-file" && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = "";
    if (/\.py$/i.test(f.name)) { showPyConfirm(f); return; }
    await showPanel("upload", `<h3>匯入 ${esc(f.name)}</h3><div id="up-msg"></div>`, "匯入");
    doImport({type: "file", filename: f.name, content: await b64(f)}, "#up-msg");
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "b-in" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); builderSend(); }
  if (e.target.id === "gh-url" && e.key === "Enter") doImport({type: "github", url: e.target.value}, "#gh-msg");
  if (e.target.id === "sk-try-in" && e.key === "Enter") document.querySelector("[data-sk-try]")?.click();
});
document.addEventListener("input", e => { if (e.target.id === "b-draft") { builderDraft = e.target.value; saveBuilder(); const b = $("[data-b-save]"); if (b) b.disabled = !builderDraft.trim(); } });
const b64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(f); });

// ── 更新 ───────────────────────────────────────────
let UPD = {};
function showUpdate(st) {
  UPD = st || {};
  const el = $("#up-status"), btn = document.querySelector("[data-up-install]");
  if (el) {
    el.innerHTML = esc(UPD.current || "") + "　" + (UPD.checking ? "檢查中…" : UPD.progress != null ? `下載中 ${UPD.progress}%`
      : UPD.error ? `<span class="bad-text">${esc(UPD.error)}</span>`
      : UPD.update_available ? `→ 有新版本 <b>${esc(UPD.latest.version)}</b>${UPD.can_install ? "" : "（" + esc(UPD.why_cannot || "這個平台沒有安裝檔") + "）"}`
      : UPD.checked ? `已經是最新版本` : "");
  }
  if (btn) btn.disabled = !UPD.can_install;
  const bar = $("#update-bar");
  if (UPD.update_available) {
    bar.innerHTML = `有新版本 <b>${esc(UPD.latest.version)}</b>（目前 ${esc(UPD.current)}）　` +
      (UPD.can_install ? `<a href="#" data-up-install>立即更新</a>　` : "") + `<a href="${esc(UPD.latest.url || "#")}" target="_blank" rel="noopener">看更新內容</a>`;
    if (bar.hidden) { bar.hidden = false; enterEl(bar); }
  } else bar.hidden = true;
}
async function startUpdate() {
  if (!confirm(`下載並安裝 ${UPD.latest?.version}？下載完會請你重新啟動來換上新版本。`)) return;
  const poll = setInterval(async () => showUpdate(await j("/api/update")), 500);
  const r = await post("/api/update/download", {});
  clearInterval(poll); showUpdate(await j("/api/update"));
  if (!r.ok) { toast(r.error || "更新失敗", 5000); return; }
  if (confirm("新版本已經下載好。現在重新啟動來換上新版本？（正在執行的工作流會被中斷）")) {
    await post("/api/update/restart", {}); toast("正在重新啟動…", 0);
  }
}
document.addEventListener("click", async e => {
  if (e.target.closest("[data-browser-login]")) {
    e.preventDefault();
    const r = await post("/api/browser/login", {});
    toast(r.ok ? "已打開登入視窗；登入完記得把視窗關掉" : (r.error || "打不開瀏覽器"), 4000);
    return;
  }
  if (e.target.closest("[data-up-check]")) { e.preventDefault(); $("#up-status").textContent = "檢查中…"; showUpdate(await post("/api/update/check", {})); }
  if (e.target.closest("[data-up-install]")) { e.preventDefault(); startUpdate(); }
});

// ── 輪詢 ───────────────────────────────────────────
let busy = false, again = false;
async function tick() {
  if (busy) { again = true; return; }                     // 正在更新時的點擊不能丟掉，做完馬上再跑一次
  busy = true;
  try {
    const [wfs, runs] = await Promise.all([j("/api/workflows"), j("/api/runs")]);
    WFS = wfs; WF = Object.fromEntries(wfs.map(w => [w.name, w]));
    if (selWf && !WF[selWf]) selWf = null;
    const visible = runs.filter(r => !selWf || r.workflow === selWf);
    if (!selRun || !visible.some(r => r.id === selRun)) selRun = visible[0]?.id || null;
    const minute = Math.floor(Date.now() / 60000);
    renderSummary(runs);
    // 選單開著、或正在輸入時先不重畫，但也不能把這次變化記成「已處理」，否則之後永遠不會畫（errata C2：看布林值，不看 class）
    const barBlocked = Object.values(menuOpen).some(Boolean) || document.activeElement?.classList.contains("runin")
                       || document.activeElement?.classList.contains("run-depth");
    if (!barBlocked && changed("bar", [wfs, selWf, minute])) renderBar();
    if (changed("runs", [runs, selRun, selWf, showAll, minute])) renderRuns(runs);
    await loadDetail();
  } catch {
    $("#summary").innerHTML = `<span class="bad-text">連不上工作流伺服器</span>，可能正在重新啟動；恢復後會自動更新。`;
  } finally { busy = false; if (again) { again = false; tick(); } }
}
async function liveLoop() {
  let active = false;
  try { active = await loadLive(); } catch {}
  setTimeout(liveLoop, active ? 700 : 2500);
}
async function start() {
  try { [PROV, SKILLS, SETTINGS, USAGE, DEPTH] = await Promise.all([j("/api/providers"), j("/api/skills"), j("/api/settings"), j("/api/usage"), j("/api/depth")]); } catch {}
  placeTabInd(true);
  await tick(); liveLoop();
  setInterval(tick, 3000);
  setInterval(async () => { try { [PROV, USAGE] = await Promise.all([j("/api/providers"), j("/api/usage")]); } catch {} }, 30000);
  setTimeout(async () => { try { showUpdate(await j("/api/update")); } catch {} }, 4000);
  setInterval(async () => { try { showUpdate(await j("/api/update")); } catch {} }, 60000);
}
// 原生視窗要等 pywebview 把橋接接好才能開始；瀏覽器直接開始
if (window.pywebview?.api?.request || !window.__NATIVE__) start();
else window.addEventListener("pywebviewready", start, {once: true});
</script>
