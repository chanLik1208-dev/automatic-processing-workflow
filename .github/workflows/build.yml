name: build

# 合併到 main、而且 version.py 的版本還沒發佈過：自動發佈 v<版本>（不用手動打標籤）。
#   四個平台各自編譯、實際啟動測一次；全部成功才把 release 公開，標籤也在公開時才建立（之前一直是草稿，不會出現空的 release）。
#   版本號沒變的合併（只改文件之類）不會發佈。
# 推 v* 標籤：跟以前一樣，手動發佈那個版本。
# 推到 release-check 分支（或手動觸發）：一樣編譯和測試，但放進「草稿」release，不公開發佈
#
# 執行檔直接上傳到 Releases，不用 Actions 的 artifact：私人 repo 的 artifact 儲存配額很容易用完，
# Releases 的檔案不算在那個配額裡。
on:
  push:
    tags: ["v*"]
    branches: ["release-check", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      release: ${{ steps.t.outputs.release }}     # true：正式版（成功就公開）；false：測試草稿
      skip: ${{ steps.t.outputs.skip }}           # true：main 上這個版本已經發佈過，不用編譯
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE=false SKIP=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # 合併到 main：版本號是新的才發佈。
            # （Actions 自己建立的標籤不會再觸發另一個 Actions，所以不能「先打標籤、讓標籤觸發編譯」，要在這裡直接做）
            VER=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$GH_REPO/contents/version.py?ref=$GITHUB_SHA" | sed -n 's/^VERSION = "\(.*\)"/\1/p')
            [ -n "$VER" ] || { echo "讀不到 version.py 的版本"; exit 1; }
            TAG="v$VER"
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "$TAG 已經發佈過（版本號沒變），這次合併不發佈"
              SKIP=true
            else
              # 上次同版本編譯失敗留下的草稿先刪掉再重來（草稿還沒有標籤，刪掉不影響任何東西）
              if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
                gh release delete "$TAG" --yes
              fi
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
              RELEASE=true
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            # 程式裡的版本號要跟標籤一致，否則更新檢查會一直以為有新版
            curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$GH_REPO/contents/version.py?ref=$GITHUB_SHA" | grep -q "VERSION = \"${TAG#v}\"" \
              || { echo "version.py 的版本跟標籤 $TAG 不一致"; exit 1; }
            gh release create "$TAG" --draft --title "$TAG" --generate-notes --verify-tag
            RELEASE=true
          else
            TAG="check-${GITHUB_RUN_NUMBER}"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "測試編譯 #${GITHUB_RUN_NUMBER}（${GITHUB_REF_NAME}）" \
              --notes "release-check 分支的測試編譯，草稿，不公開。commit ${GITHUB_SHA}"
          fi
          { echo "tag=$TAG"; echo "release=$RELEASE"; echo "skip=$SKIP"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
          - os: macos-15-intel  # Intel Mac（macos-13 已淘汰，排隊會一直等不到機器）
          - os: ubuntu-22.04    # 用較舊的 glibc 編，新舊發行版都能跑
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller pywebview PySide6-Essentials truststore certifi pypdf
      - name: 發佈前檢查（設定、skill、匯出、排程鎖…；需要本地模型的項目在 CI 上會略過）
        run: python tests/run_checks.py
      - run: python build.py

      - name: 啟動測試（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          BIN=$(cat dist/test-bin.txt)          # macOS：.app 裡的執行檔；Linux：打包前的執行檔
          "$BIN" list
          AUTOWORKFLOW_HOME=$RUNNER_TEMP/home "$BIN" --headless --port 8799 &
          for i in $(seq 1 60); do curl -sf localhost:8799/api/providers > /dev/null && break; sleep 1; done
          curl -sf localhost:8799/api/workflows | python -c "import json,sys; w=json.load(sys.stdin); assert len(w)==3, w; print('ok', [x['name'] for x in w])"
          curl -sf localhost:8799/ | grep -q "自動化工作流"
          kill %1

      - name: 啟動測試（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Get-Content dist\test-bin.txt
          & $bin list
          if ($LASTEXITCODE -ne 0) { throw "list 失敗" }
          $env:AUTOWORKFLOW_HOME = "$env:RUNNER_TEMP\home"
          $p = Start-Process $bin -ArgumentList "--headless","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:8799/api/providers | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "沒有啟動" }
          $w = Invoke-RestMethod http://127.0.0.1:8799/api/workflows
          if ($w.Count -ne 3) { throw "預設工作流數量不對：$($w.Count)" }
          Stop-Process $p.Id

      - name: HTTPS 測試（打包後的程式要認得憑證；之前打包版每個 HTTPS 都 CERTIFICATE_VERIFY_FAILED）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 查更新會用 urllib 連 api.github.com：憑證有問題這裡就會失敗（不能被略過）
          AUTOWORKFLOW_HOME="$RUNNER_TEMP/https-home" "$(cat dist/test-bin.txt)" update --check

      - name: 介面自我測試（真的開出 Qt 介面，離屏、不需要螢幕；存截圖）
        shell: bash
        run: |
          # macOS / Linux 用離屏模式；Windows 的離屏模式讀不到系統字型（截圖全是方塊），改用真的 Windows 視窗
          [ "$RUNNER_OS" != "Windows" ] && export QT_QPA_PLATFORM=offscreen
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk libegl1 libxkbcommon0 > /dev/null   # 中文字型只是讓截圖看得懂
          fi
          AUTOWORKFLOW_HOME="$RUNNER_TEMP/ui-home" "$(cat dist/test-bin.txt)" --self-test-ui "$RUNNER_TEMP/ui"
          cd "$RUNNER_TEMP/ui" && for f in *.png; do mv "$f" "ui-${{ matrix.os }}-$f"; done && ls

      - name: 介面模組都有打包（放在 Qt 自我測試之後：Linux 要先裝好 Qt 需要的系統函式庫；之前 WebView 模組沒打包進去，每台電腦都默默改開 Qt 版）
        shell: bash
        run: '"$(cat dist/test-bin.txt)" --check-ui'

      - name: 截圖放進測試草稿（正式版不放）
        if: needs.prepare.outputs.release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "$RUNNER_TEMP"/ui/*.png --clobber

      - name: 上傳到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "$(cat dist/upload.txt)" --clobber

  publish:
    # 四個平台都編譯、測試、上傳成功，才把正式版的草稿公開；任何一個失敗就維持草稿
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh release view "${{ needs.prepare.outputs.tag }}" --json assets --jq '.assets | length')
          [ "$n" -eq 4 ] || { echo "只有 $n 個執行檔，不公開"; exit 1; }
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
